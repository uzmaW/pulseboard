version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: pulseboard
      POSTGRES_PASSWORD: pulseboard_dev
      POSTGRES_DB: pulseboard_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: pulseboard-dev-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
    volumes:
      - ./config/livekit.yml:/etc/livekit.yaml

volumes:
  postgres_data:
  vault_data:
  clickhouse_data:
